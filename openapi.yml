openapi: 3.0.0
info:
  title: Billiard-diary-backend API
  version: 1.0.0

paths:
  /exercises:
    post:
      tags: [Exercises]
      summary: Создать упражнение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Exercise"
      responses:
        "201":
          description: Exercise created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [Exercises]
      summary: Получение всех упражнений
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  exercises:
                    type: array
                    items:
                      $ref: "#/components/schemas/Exercise"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /exercises/{id}:
    get:
      tags: [Exercises]
      summary: Получить упражнение по id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  exercise:
                    $ref: "#/components/schemas/Exercise"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags: [Exercises]
      summary: Обновление упражнения
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Exercise"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Exercises]
      summary: Удаление упражнения
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Success (no content)
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Exercise:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        description:
          type: string
        position:
          type: object
          additionalProperties: false
          properties:
            balls:
              type: array
              items:
                type: object
                required: [x, y, type]
                additionalProperties: false
                properties:
                  x: { type: number }
                  y: { type: number }
                  type: { type: string }
            lines:
              type: array
              items:
                type: object
                required: [from, to, type]
                additionalProperties: false
                properties:
                  from:
                    type: object
                    required: [x, y]
                    additionalProperties: false
                    properties:
                      x: { type: number }
                      y: { type: number }
                  to:
                    type: object
                    required: [x, y]
                    additionalProperties: false
                    properties:
                      x: { type: number }
                      y: { type: number }
                  type: { type: string }
            spin:
              type: object
              required: [x, y]
              additionalProperties: false
              properties:
                x: { type: number }
                y: { type: number }
            power:
              type: number
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Error:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum: [false]
          example: false
        error:
          type: string
          example: "db error"
